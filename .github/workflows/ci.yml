name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -v

  check-samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Clean set must pass
        run: arxml-check samples/clean
      - name: Broken set must be caught (exit code 1)
        run: |
          set +e
          arxml-check samples/broken --html report.html
          test $? -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: arxml-report
          path: report.html
